<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đổi mật khẩu - Aurelia</title>
        <link rel="stylesheet" type="text/css" href="assets/css/auth.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body class="auth-body">
        <div class="auth-wrapper">
            
            <div class="auth-image">
                <div class="image-text">
                    <h2>Bảo mật tài khoản</h2>
                    <p>Cập nhật mật khẩu mới để đảm bảo an toàn cho tài khoản của bạn.</p>
                </div>
            </div>

            <div class="auth-form-section">
                <h1 class="brand-logo">AURELIA</h1>
                <h3 style="margin-bottom: 30px; font-family: 'Times New Roman', serif; text-align: center;">Tạo mật khẩu mới</h3>

                <form id="changePasswordForm">
                    
                    <div class="input-group">
                        <label for="new-password">MẬT KHẨU MỚI</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock icon"></i>
                            <input type="password" id="new-password" placeholder="••••••••" required>
                            <i class="fas fa-eye-slash icon-right toggle-password" data-target="new-password" style="cursor: pointer;"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirm-new-password">XÁC NHẬN MẬT KHẨU MỚI</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock icon"></i>
                            <input type="password" id="confirm-new-password" placeholder="••••••••" required>
                            <i class="fas fa-eye-slash icon-right toggle-password" data-target="confirm-new-password" style="cursor: pointer;"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 10px;">LƯU MẬT KHẨU</button>
                </form>

                <div style="text-align: center; margin-top: 30px;">
                    <a href="login.html" style="color: #bfa15f; text-decoration: none; font-weight: bold; font-size: 14px;">
                        Hủy và quay lại Đăng nhập
                    </a>
                </div>

            </div>

        </div>

        <script src="assets/js/auth.js"></script>
    </body>
</html>
