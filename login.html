<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng nhập</title>
        <link rel="stylesheet" type="text/css" href="assets/css/auth.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body class="auth-body">
        <div class="auth-wrapper">
            
            <div class="auth-image">
                <div class="image-text">
                    <h2>Discover Timeless Elegance</h2>
                    <p>Join Aurelia to curate your personal collection of artisanal, investment-grade jewelry.</p>
                </div>
            </div>

            <div class="auth-form-section">
                <h1 class="brand-logo">AURELIA</h1>
                
                <div class="auth-tabs">
                    <div class="tab active">Sign In</div>
                    <div class="tab">Create Account</div>
                </div>

                <form id="loginForm" action="index.html" method="get">
                        <div class="input-group">
                        <label for="email">EMAIL ADDRESS</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope icon"></i>
                            <input type="email" id="email" placeholder="your@email.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="label-row">
                            <label for="password">PASSWORD</label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>
                        <div class="input-wrapper">
                            <i class="fas fa-lock icon"></i>
                            <input type="password" id="password" placeholder="••••••••" required>
                            <i class="fas fa-eye-slash icon-right" id="togglePassword" style="cursor: pointer;"></i>
                        </div>
                    </div>

                    <div class="remember-row">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>

                    <button type="submit" class="btn-primary">SIGN IN</button>
                </form>

                <div class="divider">
                    <span>OR CONTINUE WITH</span>
                </div>

                <div class="social-login">
                    <button class="btn-social"><i class="fab fa-google"></i> Google</button>
                    <button class="btn-social"><i class="fab fa-apple"></i> Apple</button>
                </div>
            </div>

        </div>
        <script src="assets/js/auth.js"></script>
    </body>
</html>
